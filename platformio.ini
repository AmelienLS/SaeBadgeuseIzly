[platformio]
default_envs = uno_r4_wifi

[env]
framework = arduino
monitor_speed = 115200
extra_scripts =
	pre:scripts/fix_path.py

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
lib_deps =
	miguelbalboa/MFRC522 @ ^1.4.11
	arduino-libraries/SD @ ^1.3.0

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
lib_deps =
	miguelbalboa/MFRC522 @ ^1.4.11
	arduino-libraries/SD @ ^1.3.0
	arduino-libraries/ArduinoHttpClient @ ^0.5.0
